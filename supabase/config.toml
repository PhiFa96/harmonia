# Nur lokale Entwicklung; entfernte EU-Projekte werden separat konfiguriert.
# Referenz: https://supabase.com/docs/guides/local-development/cli/config
project_id = "harmonia"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000
auto_expose_new_tables = false

[db]
port = 54322
shadow_port = 54320
major_version = 17
health_timeout = "2m"

[db.migrations]
enabled = true
schema_paths = []

[db.seed]
enabled = false

[auth]
enabled = true
site_url = "http://localhost:8081"
additional_redirect_urls = ["http://127.0.0.1:8081"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
# Gastmodus (F10) bleibt eine offene Produktentscheidung.
enable_anonymous_sign_ins = false
minimum_password_length = 12

[auth.email]
enable_signup = true
double_confirm_changes = true
# Nur lokal: Testkonten brauchen keine echte E-Mail-Zustellung.
enable_confirmations = false

[local_smtp]
enabled = true
port = 54324

# Erst bei Bedarf aktivieren; P1.04 benötigt Datenbank, Auth und REST.
[studio]
enabled = false

[realtime]
enabled = false

[storage]
enabled = false

[edge_runtime]
enabled = false

[analytics]
enabled = false
