packages:
  - apps/*
  - packages/*

# Gemeinsame Versionen für alle Pakete (Einbindung über "catalog:")
catalog:
  '@eslint/js': ^10.0.1
  # App (Expo SDK 57): Versionen wie von `expo install` für SDK 57 vorgegeben
  '@types/react': ~19.2.2
  expo: ~57.0.26
  react: 19.2.3
  react-dom: 19.2.3
  react-native: 0.86.3
  react-native-svg: 15.15.4
  react-native-web: ~0.21.0
  # Notenfont Bravura (SIL OFL 1.1) mit SMuFL-Metadaten
  '@vexflow-fonts/bravura': 1.0.2
  eslint: ^10.12.0
  fast-check: ^4.10.2
  # Übersetzungen (P1.05)
  i18next: ^26.4.2
  react-i18next: ^17.0.15
  globals: ^17.0.0
  prettier: ^3.9.9
  # Nur Test-Orakel (ADR 0004). Exakt gepinnt: 6.5.0 hat eine fehlerhafte Paketierung (main → fehlende Datei)
  tonal: 6.4.3
  typescript: ~6.0.3
  typescript-eslint: ^8.71.0
  vitest: ^5.0.3

# Unterpakete von tonal, deren Release vom 28.09.2026 auf fehlende Dateien verweist ("main": dist/index.js).
# Betrifft nur das Test-Orakel. Entfernen, sobald tonal die Paketierung repariert hat.
overrides:
  '@tonaljs/pitch-distance': 5.0.5
  '@tonaljs/pitch-interval': 6.1.0
  '@tonaljs/pitch-note': 6.1.0
