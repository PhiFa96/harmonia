version: 2
updates:
  # npm-Pakete (pnpm-Lockfile). Kleinere Updates gebündelt, damit wenige Pull Requests entstehen.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      minor-und-patch:
        update-types: [minor, patch]
    ignore:
      # Bewusst gepinnt (siehe ADR 0004 und pnpm-workspace.yaml)
      - dependency-name: tonal
      - dependency-name: '@tonaljs/*'
      # Von Expo SDK 57 festgelegt (expo/bundledNativeModules.json); Wechsel nur zusammen mit einem
      # SDK-Upgrade über `npx expo install --fix`. Abweichende Versionen brechen den Web-Build bzw.
      # die nativen Builds (Okt. 2026: react-native 0.87 → ERR_PACKAGE_PATH_NOT_EXPORTED).
      - dependency-name: react
      - dependency-name: react-dom
      - dependency-name: react-native
      - dependency-name: react-test-renderer
      - dependency-name: '@react-native/*'
      - dependency-name: react-native-reanimated
      - dependency-name: react-native-worklets
      - dependency-name: react-native-svg
      - dependency-name: react-native-gesture-handler
        update-types: [version-update:semver-major, version-update:semver-minor]
      - dependency-name: react-native-screens
        update-types: [version-update:semver-major, version-update:semver-minor]
      - dependency-name: react-native-safe-area-context
        update-types: [version-update:semver-major, version-update:semver-minor]
      - dependency-name: react-native-web
        update-types: [version-update:semver-major, version-update:semver-minor]
      - dependency-name: '@types/react'
        update-types: [version-update:semver-major, version-update:semver-minor]
      - dependency-name: 'expo*'
        update-types: [version-update:semver-major, version-update:semver-minor]
      - dependency-name: jest-expo
        update-types: [version-update:semver-major, version-update:semver-minor]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ['*']
