name: CI

on:
  pull_request:
  push:
    branches: [main]

# Ältere Läufe desselben Branches abbrechen, wenn neue Commits kommen
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Lint, Typen, Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # Version kommt aus "packageManager" in package.json
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Abhängigkeiten installieren
        run: pnpm install --frozen-lockfile

      - name: Formatierung
        run: pnpm format:check

      - name: Lint und Paket-Abhängigkeiten
        run: pnpm lint

      - name: Typprüfung
        run: pnpm typecheck

      - name: Tests
        run: pnpm test

      - name: Übersetzungen
        run: pnpm check:i18n

  web:
    name: Web-Build der App
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Abhängigkeiten installieren
        run: pnpm install --frozen-lockfile

      - name: Web-Bundle bauen (expo export)
        run: pnpm --filter @harmonia/mobile build:web

  deno:
    name: Deno-Kompatibilität
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.6

      - name: Theorie, Übungen und Lektion unter Deno prüfen
        run: deno check --config tools/deno.json tools/deno-smoke.ts

      - name: Theorie, Übungen und Lektion unter Deno ausführen
        run: deno run --config tools/deno.json tools/deno-smoke.ts

  database:
    name: Supabase und Profil-Zugriffsschutz
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_TELEMETRY_DISABLED: '1'
      SUPABASE_NO_UPDATE_NOTIFIER: '1'
      SUPABASE_INTERNAL_IMAGE_REGISTRY: docker.io
      SUPABASE_USE_SLIM_IMAGES: '1'
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Abhängigkeiten installieren
        run: pnpm install --frozen-lockfile

      - name: Lokales Supabase starten
        # Die CLI gibt lokale Schlüssel aus; nicht im CI-Protokoll veröffentlichen.
        run: pnpm db:start > "$RUNNER_TEMP/harmonia-supabase-start.log" 2>&1

      - name: Migrationen aus leerer lokaler Datenbank prüfen
        run: pnpm db:reset

      - name: Datenbankfunktionen prüfen
        run: pnpm db:lint

      - name: pgTAP-Zugriffstests
        run: pnpm db:test

      - name: Auth- und REST-API mit zwei Konten prüfen
        run: pnpm db:test:api

      - name: Lokale Container stoppen
        if: always()
        run: pnpm db:stop
