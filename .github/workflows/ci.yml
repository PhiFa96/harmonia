name: CI

on:
  pull_request:
  push:
    branches: [main]

# Ältere Läufe desselben Branches abbrechen, wenn neue Commits kommen
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Lint, Typen, Tests
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      # Version kommt aus "packageManager" in package.json
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Abhängigkeiten installieren
        run: pnpm install --frozen-lockfile

      - name: Formatierung
        run: pnpm format:check

      - name: Lint und Paket-Abhängigkeiten
        # TypeScript project service retains several workspace programs; hosted runners default to a smaller heap.
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: pnpm lint

      - name: Typprüfung
        run: pnpm typecheck

      - name: Werkzeugtests
        run: pnpm test:tools

      - name: Pakettests
        run: pnpm -r --if-present --filter '!@harmonia/mobile' test

      - name: App-Tests
        working-directory: apps/mobile
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: pnpm exec jest --runInBand

      - name: KI-Verordnungsinventar und Codebindung prüfen
        run: pnpm check:ai

      - name: Zertifikatsentwurf, Quellenbindung und offene Freigaben prüfen
        run: pnpm check:certificates

      - name: Rechtliche Freigabefelder und geschlossene Vorbereitung prüfen
        run: pnpm check:legal

      - name: Store-Texte, Sprachen und geschlossene Veröffentlichung prüfen
        run: pnpm check:storefront

      - name: Beta-Vorbereitung und offene Startvoraussetzungen prüfen
        run: pnpm check:beta

      - name: P2-Releasevorbereitung mit offenen Abnahmen prüfen
        run: pnpm p2:status

      - name: Übersetzungen
        run: pnpm check:i18n

      - name: Inhaltsgraph, Notenbeispiele und Freigaben
        run: pnpm check:content

      - name: Fähigkeitszuordnung, Lernreihenfolge und Planungsdiagramme
        run: pnpm check:curriculum

      - name: Tutor-Testkatalog, Sprachfassungen und Abdeckung
        run: pnpm check:tutor:catalogue

      - name: Tutor-Testkatalog v2 (Stufe 3/4, Quellen, Lernstand)
        run: pnpm check:tutor:catalogue-v2

  tutor_benchmark:
    name: Tutor-Batchmechanik ohne Modellkosten
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Abhängigkeiten installieren
        run: pnpm install --frozen-lockfile
      - name: Explizite Simulation mit mitgelieferten Quellen vorbereiten
        run: |
          node --input-type=module - <<'JS'
          import { readFileSync, writeFileSync } from 'node:fs';
          const config = JSON.parse(readFileSync('tools/tutor-benchmark/config.example.json', 'utf8'));
          config.sourceMode = 'supplied';
          writeFileSync(process.env.RUNNER_TEMP + '/tutor-benchmark-config.json', JSON.stringify(config), { mode: 0o600 });
          JS
          pnpm tutor:benchmark prepare --simulate --config "$RUNNER_TEMP/tutor-benchmark-config.json" --run "$RUNNER_TEMP/tutor-benchmark-run.json"
      - name: Alle simulierten Werkzeugdialoge abschließen
        run: pnpm tutor:benchmark simulate --run "$RUNNER_TEMP/tutor-benchmark-run.json"
      - name: Technische Belege und geschlossenes Release-Gate prüfen
        run: |
          pnpm tutor:benchmark evaluate --run "$RUNNER_TEMP/tutor-benchmark-run.json" --output "$RUNNER_TEMP/tutor-benchmark-summary.json"
          node tools/assert-tutor-benchmark.mjs "$RUNNER_TEMP/tutor-benchmark-summary.json"
      - name: Simulations-Zusammenfassung aufbewahren
        uses: actions/upload-artifact@v7
        with:
          name: tutor-benchmark-simulation
          path: ${{ runner.temp }}/tutor-benchmark-summary.json
          retention-days: 14

  web:
    name: Web-Build der App
    runs-on: ubuntu-latest
    # Chromium installation took ten minutes in run 210; retain time for the complete suite.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Abhängigkeiten installieren
        run: pnpm install --frozen-lockfile

      - name: Isolierte Gast-Vorschau für Web-E2E bauen
        run: pnpm qa:build --output apps/mobile/dist

      - name: Chromium für Web-E2E installieren
        run: pnpm exec playwright install --with-deps chromium

      - name: Kernabläufe, axe, Tastatur und Leistungsbudgets prüfen
        run: pnpm qa:web

      - name: Lokale Satzwerkstatt mit eigenen Entwürfen prüfen
        run: pnpm voice-leading:test:web

      - name: Internes Schul-Dashboard mit isoliertem PostgreSQL prüfen
        run: pnpm school:test:web

      - name: Synthetische Schul-Dashboard-Prüfungen aufbewahren
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: school-draft-fixtures
          path: artifacts/quality/school
          if-no-files-found: ignore
          retention-days: 7
      - name: Internen Zertifikats-Prototyp mit eigenem lokalem Server prüfen
        run: pnpm certificates:test:web

      - name: Privaten Beta-Zugang und Testhinweise mit eigenen Fixtures prüfen
        env:
          HARMONIA_QA_OUTPUT: artifacts/quality/beta-playwright
        run: pnpm beta:test:web

      - name: Web-Prüfnachweise aus eigenen Gast-Fixtures aufbewahren
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: web-quality-fixtures
          path: artifacts/quality/playwright
          if-no-files-found: ignore
          retention-days: 7

      - name: Synthetische Zertifikatsprüfungen und Muster-PDFs aufbewahren
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: certificate-draft-fixtures
          path: artifacts/quality/certificates
          if-no-files-found: ignore
          retention-days: 7

      - name: Synthetische Beta-Webprüfungen aufbewahren
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: beta-web-fixtures
          path: artifacts/quality/beta-playwright
          if-no-files-found: ignore
          retention-days: 7

      - name: Produktions-Bundle mit öffentlichen Inhalten bauen
        env:
          APP_VARIANT: production
        run: pnpm check:content && pnpm --filter @harmonia/mobile build:web

      - name: Statische Website neben der öffentlichen Web-App bauen
        run: pnpm website:build

      - name: Tatsächlichen Export auf Entwurfsdaten, Texte und Größenbudgets prüfen
        run: pnpm check:content:bundle && pnpm qa:bundle

      - name: Öffentliche Zeitreise und Chor-Route verweigern Entwürfe in DE und EN
        env:
          HARMONIA_QA_VARIANT: production
          HARMONIA_QA_OUTPUT: artifacts/quality/drafts-production
        run: pnpm qa:web e2e/web/history-journey.spec.mjs e2e/web/choir-production.spec.mjs

      - name: Öffentliche Entwurfsprüfungen aufbewahren
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: drafts-production-fixtures
          path: artifacts/quality/drafts-production
          if-no-files-found: ignore
          retention-days: 7

  deno:
    name: Deno-Kompatibilität
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.6

      - name: Theorie, Übungen, Lektion und Fähigkeitsplan unter Deno prüfen
        run: deno check --config tools/deno.json tools/deno-smoke.ts

      - name: Engine-geprüfte Sync-Funktion unter Deno prüfen
        run: deno check --config supabase/functions/deno.json supabase/functions/learning-sync/index.ts supabase/functions/content-reports/index.ts supabase/functions/motivation/index.ts supabase/functions/reminder-dispatch/index.ts supabase/functions/tutor/index.ts supabase/functions/privacy/index.ts supabase/functions/privacy-retention/index.ts tools/tutor-live.ts

      - name: Theorie, Übungen, Lektion und Fähigkeitsplan unter Deno ausführen
        run: deno run --config tools/deno.json tools/deno-smoke.ts

      - name: Push-Tickets, Receipts und Transportfehler ohne echten Versand prüfen
        run: deno run --config supabase/functions/deno.json --allow-env=EXPO_ACCESS_TOKEN tools/push-smoke.ts

      - name: Tutor-Werkzeuge, SDK-Streaming und Testtarif ohne echte KI-Kosten prüfen
        run: deno run --config tools/deno.json --allow-env=ANTHROPIC_CUSTOM_HEADERS tools/tutor-smoke.ts

      - name: Wissensabschnitte, native Zitate und versionierte Quellen prüfen
        run: |
          deno check --config tools/deno.json tools/knowledge-smoke.ts
          deno run --config tools/deno.json --allow-env=ANTHROPIC_CUSTOM_HEADERS tools/knowledge-smoke.ts

      - name: Artikel der Stufen 3–5 und Suchfragen-Abdeckung prüfen
        run: |
          deno check --config tools/deno.json tools/knowledge-v2-smoke.ts
          deno run --config tools/deno.json tools/knowledge-v2-smoke.ts

  database:
    name: Supabase und Profil-Zugriffsschutz
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_TELEMETRY_DISABLED: '1'
      SUPABASE_NO_UPDATE_NOTIFIER: '1'
      SUPABASE_INTERNAL_IMAGE_REGISTRY: docker.io
      SUPABASE_USE_SLIM_IMAGES: '1'
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Abhängigkeiten installieren
        run: pnpm install --frozen-lockfile

      - name: Lokales Supabase starten
        # Die CLI gibt lokale Schlüssel aus; nicht im CI-Protokoll veröffentlichen.
        run: |
          if ! pnpm db:start > "$RUNNER_TEMP/harmonia-supabase-start.log" 2>&1; then
            node tools/local-backend-diagnostics.mjs "$RUNNER_TEMP/harmonia-supabase-start.log"
            exit 1
          fi

      - name: Migrationen aus leerer lokaler Datenbank prüfen
        run: pnpm db:reset

      - name: Datenbankfunktionen prüfen
        run: pnpm db:lint

      - name: pgTAP-Zugriffstests
        run: pnpm db:test

      - name: Internes Schulmodell mit pgTAP und echten HTTP-/DB-Tests prüfen
        run: pnpm school:test:db --supabase && pnpm school:test

      - name: Auth- und REST-API mit zwei Konten prüfen
        run: pnpm db:test:api

      - name: Profileinstellungen, atomare Feldänderungen und Kontentrennung prüfen
        run: pnpm db:test:profile

      - name: E-Mail-Codes, Bestätigung, Sitzung und Abmeldung prüfen
        run: pnpm db:test:email

      - name: Getrennte öffentliche und interne Wissensindexe lokal erzeugen
        run: |
          pnpm knowledge:sync
          pnpm knowledge:sync --preview

      - name: Öffentliche Lernpfad-Funktion verweigert Entwurfsinhalte
        run: |
          node tools/serve-local-learning.mjs --published --tutor-test --billing-test > "$RUNNER_TEMP/harmonia-learning-public.log" 2>&1 &
          harmonia_learning_pid=$!
          trap 'kill "$harmonia_learning_pid" 2>/dev/null || true' EXIT
          # This test waits for the actual Edge worker before the other API checks start.
          node tools/test-learning-sync.mjs --published
          node tools/test-access.mjs --published
          node tools/test-content-reports.mjs --published
          node tools/test-tutor.mjs --published
          node tools/test-knowledge.mjs --published
          kill "$harmonia_learning_pid"
          wait "$harmonia_learning_pid" || true
          trap - EXIT

      - name: Lokale Lernpfad-Synchronisation starten
        run: pnpm db:serve:learning --tutor-test --billing-test > "$RUNNER_TEMP/harmonia-learning.log" 2>&1 &

      - name: Offline-Versuche und Synchronisation zwischen zwei Geräten prüfen
        run: pnpm db:test:learning

      - name: Rating-Sync, Rückrechnung, Kontentrennung und parallele Aktualisierungen prüfen
        run: pnpm db:test:ratings

      - name: FSRS mit echten lokalen Konten prüfen
        run: pnpm db:test:reviews

      - name: Inhaltsmeldungen, Wiederholungen und Konto-Isolation prüfen
        run: pnpm db:test:reports

      - name: Motivation, Schutzkäufe, Zeitzonen und ersetzten Push-Versand prüfen
        run: pnpm db:test:motivation

      - name: Tutor-SSE, Verlauf, Antwortmeldungen, Abo, Budgets und Löschung lokal prüfen
        run: pnpm db:test:tutor

      - name: Volltextsuche, Quellenrückzug, Zitate und Konto-Zugriff lokal prüfen
        run: pnpm db:test:knowledge

      - name: Trigramm-Suche mit 198 Fragen zu den Artikeln der Stufen 3–5 lokal prüfen
        run: pnpm db:test:knowledge:v2

      - name: Abo-Webhooks, Konto-Isolation und ersetzten RevenueCat-Kontostand prüfen
        run: pnpm db:test:billing

      - name: Lernenergie und öffentlicher Kündigungseingang prüfen
        run: pnpm db:test:access

      - name: Datenschutz, Export, Aufbewahrung und Kontolöschung lokal prüfen
        run: pnpm db:test:privacy

      - name: Einwilligung, Analytics und private Kennzahlen prüfen
        run: pnpm db:test:analytics

      - name: Lokale Container stoppen
        if: always()
        run: pnpm db:stop
